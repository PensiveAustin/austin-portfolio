name: Keep Supabase awake
on:
  schedule:
    - cron: '0 3 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query the database
        run: |
          KEY=$(grep -o "eyJ[^']*" config.js | head -1)
          curl -fsS "https://zpqujmxsqnezmopumuxf.supabase.co/rest/v1/site_status?select=state&id=eq.1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
